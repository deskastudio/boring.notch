name: Build Custom Boring Notch

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Boring Notch App
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj

      - name: Build App
        run: |
          xcodebuild -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            clean build

      - name: Archive App Bundle
        run: |
          cd "$RUNNER_TEMP/build"
          ls -la
          APP_PATH=$(find . -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          ditto -c -k --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/boringNotch-custom.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boringNotch-custom
          path: boringNotch-custom.zip
          retention-days: 7
